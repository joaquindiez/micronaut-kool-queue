<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="940" height="440" fill="#FFFFFF"/>

  <text x="40" y="44" font-size="17" font-weight="600" fill="#16181D">Kool Queue vs Solid Queue 1.7.0</text>
  <text x="40" y="66" font-size="11.5" fill="#6C7079">Same machine, same PostgreSQL 16.13, 5 worker threads each, 3 repetitions · jobs per second, mean ± SD</text>

  <!-- legend -->
  <rect x="700" y="35" width="10" height="10" rx="2" fill="#0FA07F"/>
  <text x="716" y="44" font-size="11.5" fill="#16181D">Kool Queue</text>
  <rect x="801" y="35" width="10" height="10" rx="2" fill="#EB6834"/>
  <text x="817" y="44" font-size="11.5" fill="#16181D">Solid Queue</text>

  <text x="900" y="126" font-size="10.5" fill="#9AA0A6" text-anchor="end">ratio</text>

  <!-- ======== row 1: 100 ms job · axis to 60 ======== -->
  <path d="M200,133 V183" stroke="#E3E1DC" stroke-width="1" fill="none"/>
  <text x="40" y="154" font-size="12.5" font-weight="600" fill="#16181D">100 ms job</text>
  <text x="40" y="170" font-size="10.5" fill="#9AA0A6">own axis, to 60/s</text>
  <path d="M200,137 H544.3 Q548.3,137 548.3,141 V153 Q548.3,157 544.3,157 H200 Z" fill="#0FA07F"/>
  <path d="M200,159 H484.9 Q488.9,159 488.9,163 V175 Q488.9,179 484.9,179 H200 Z" fill="#EB6834"/>
  <path d="M542.4,143 V151 M542.4,147 H554.2 M554.2,143 V151" stroke="#3C4149" stroke-width="1.3" fill="none"/>
  <path d="M485.2,165 V173 M485.2,169 H492.6 M492.6,165 V173" stroke="#3C4149" stroke-width="1.3" fill="none"/>
  <text x="566" y="151" font-size="12" font-weight="600" fill="#16181D">47.5 ± 0.8</text>
  <text x="566" y="173" font-size="12" fill="#3C4149">39.4 ± 0.5</text>
  <text x="900" y="162" font-size="14" font-weight="600" fill="#16181D" text-anchor="end">1.2×</text>

  <!-- ======== row 2: empty job · axis to 700 ======== -->
  <path d="M200,223 V273" stroke="#E3E1DC" stroke-width="1" fill="none"/>
  <text x="40" y="244" font-size="12.5" font-weight="600" fill="#16181D">Empty job</text>
  <text x="40" y="260" font-size="10.5" fill="#9AA0A6">own axis, to 700/s</text>
  <path d="M200,227 H515.1 Q519.1,227 519.1,231 V243 Q519.1,247 515.1,247 H200 Z" fill="#0FA07F"/>
  <path d="M200,249 H247 Q251,249 251,253 V265 Q251,269 247,269 H200 Z" fill="#EB6834"/>
  <path d="M435.4,233 V241 M435.4,237 H602.8 M602.8,233 V241" stroke="#3C4149" stroke-width="1.3" fill="none"/>
  <path d="M249.8,255 V263 M249.8,259 H252.2 M252.2,255 V263" stroke="#3C4149" stroke-width="1.3" fill="none"/>
  <text x="614" y="241" font-size="12" font-weight="600" fill="#16181D">507.6 ± 133.2</text>
  <text x="264" y="263" font-size="12" fill="#3C4149">81.2 ± 1.9</text>
  <text x="900" y="252" font-size="14" font-weight="600" fill="#16181D" text-anchor="end">6.3×</text>

  <!-- ======== row 3: enqueue only · axis to 1300 ======== -->
  <path d="M200,313 V363" stroke="#E3E1DC" stroke-width="1" fill="none"/>
  <text x="40" y="334" font-size="12.5" font-weight="600" fill="#16181D">Enqueue only</text>
  <text x="40" y="350" font-size="10.5" fill="#9AA0A6">own axis, to 1,300/s</text>
  <path d="M200,317 H585.2 Q589.2,317 589.2,321 V333 Q589.2,337 585.2,337 H200 Z" fill="#0FA07F"/>
  <path d="M200,339 H289.1 Q293.1,339 293.1,343 V355 Q293.1,359 289.1,359 H200 Z" fill="#EB6834"/>
  <text x="601" y="331" font-size="12" font-weight="600" fill="#16181D">~1,150</text>
  <text x="305" y="353" font-size="12" fill="#3C4149">~275</text>
  <text x="900" y="342" font-size="14" font-weight="600" fill="#16181D" text-anchor="end">4.2×</text>

  <!-- footnote: the caveats travel with the picture -->
  <path d="M40,390 H900" stroke="#E3E1DC" stroke-width="1" fill="none"/>
  <text x="40" y="410" font-size="10.5" fill="#6C7079">One worker process on each side, which flatters the JVM: Ruby has a GVL, so Solid Queue scales in production by running several</text>
  <text x="40" y="426" font-size="10.5" fill="#6C7079">worker processes rather than more threads. PostgreSQL ran on the same machine, so network latency — which penalises the chattier design — is absent.</text>
</svg>
